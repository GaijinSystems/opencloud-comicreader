# OpenCloud's stock policy (from opencloud/services/proxy/pkg/config/csp.yaml)
# with TWO additions for this app, both marked below: one required, one
# optional.
#
# Note that this file REPLACES the built-in policy wholesale — it is not
# merged — so every directive has to be present, not just the changed one.
directives:
  child-src:
    - "'self'"
    # Optional. Lets zip.js use its blob-URL worker pool so CBZ inflation runs
    # off the main thread. Without it CBZ still works, just on the main thread.
    - 'blob:'
  connect-src:
    - "'self'"
    - 'blob:'
    - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
    - 'https://update.opencloud.eu/'
  default-src:
    - "'none'"
  font-src:
    - "'self'"
  frame-ancestors:
    - "'self'"
  frame-src:
    - "'self'"
    - 'blob:'
    - 'https://embed.diagrams.net/'
  img-src:
    - "'self'"
    - 'data:'
    - 'blob:'
  manifest-src:
    - "'self'"
  media-src:
    - "'self'"
  object-src:
    - "'self'"
    - 'blob:'
  script-src:
    - "'self'"
    - "'unsafe-inline'"
    # REQUIRED for CBR / CB7 / C7Z. Their decoders are WebAssembly builds, and
    # without this the browser refuses to compile them. CBZ is unaffected,
    # unless its pages are in bzip2, LZMA or PPMd.
    - "'wasm-unsafe-eval'"
  style-src:
    - "'self'"
    - "'unsafe-inline'"
