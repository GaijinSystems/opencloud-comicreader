<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comic Reader — fit, rotation and click-zone harness</title>
<!--
  A stand-alone page that lays out pages exactly as ReaderViewport.vue does,
  so the geometry can be checked in a browser without an OpenCloud instance.

  It loads nothing from the network. In particular it does NOT load Tailwind:
  the app ships no utility CSS of its own, so a harness that compiled every
  class on demand would pass where the app fails. Everything that matters is
  an inline style, copied from the component, and tests/unit/harness.spec.ts
  fails if the copies drift.

  Use it by hand with the controls, or scripted: every control is also a URL
  parameter, and the outcome is written, as JSON, into #result.

    ?mode=fit-width&rot=90&two=1&wide=1&failed=1&side=1&scroll=end&zones=1
    ?all=1     every mode, rotation, layout, failed state and scroll position
               in one load; #result is then an array (scripts/check-harness.sh)
-->
<style>
  :root { --surface:#f3f2f7; --surface-high:#e7e5ee; --outline:#c9c6d4; --fg:#1c1b20; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) {
    --surface:#1e1c24; --surface-high:#2a2732; --outline:#46424f; --fg:#eceaf2; } }
  :root[data-theme=dark] { --surface:#1e1c24; --surface-high:#2a2732; --outline:#46424f; --fg:#eceaf2; }

  /* The parts of the host's reset (Tailwind preflight) the layout depends on.
     `img { max-width: 100% }` in particular is why the component sets
     `maxWidth: none` in three of its four modes. */
  *, ::before, ::after { box-sizing: border-box; }
  img, video { max-width: 100%; height: auto; }
  #viewport button { background: transparent; border: 0; padding: 0; font: inherit; color: inherit; }

  html, body { height: 100%; margin: 0; background: var(--surface); color: var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  .app { display: flex; flex-direction: column; height: 100%; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: .75rem; padding: .5rem;
    font-size: .875rem; background: var(--surface-high); border-bottom: 1px solid var(--outline); }
  .bar label { display: flex; align-items: center; gap: .25rem; }
  .bar button { border: 1px solid var(--outline); border-radius: .25rem; padding: .25rem .5rem;
    background: transparent; color: inherit; font: inherit; cursor: pointer; }
  .group { display: flex; gap: .25rem; }
  .main { display: flex; flex: 1 1 0; min-height: 0; }
  .side { width: 16rem; flex: 0 0 auto; padding: .75rem; font-size: .875rem;
    background: var(--surface-high); border-right: 1px solid var(--outline); }
  .col { display: flex; flex-direction: column; flex: 1 1 0; min-height: 0; min-width: 0; }
  .banner { padding: .25rem .75rem; text-align: center; font-size: .875rem;
    background: var(--surface-high); border-bottom: 1px solid var(--outline); }
  .footer { display: flex; align-items: center; gap: .75rem; padding: .5rem .75rem; font-size: .875rem;
    white-space: nowrap; overflow: hidden; height: 2.25rem; flex: 0 0 auto;
    background: var(--surface-high); border-top: 1px solid var(--outline); }
  #state { margin-left: auto; font-family: ui-monospace, monospace; font-size: .75rem; opacity: .8; }
  /* What App.vue puts on the viewport: `grow min-h-0`. */
  .grow { flex-grow: 1; min-height: 0; }
</style>
</head>
<body>
<div class="app">

  <div class="bar">
    <strong>Fit:</strong><div id="fits" class="group"></div>
    <strong>Rotate:</strong><div id="rots" class="group"></div>
    <label><input type="checkbox" id="two"> two-page pref</label>
    <label><input type="checkbox" id="wide"> wide page</label>
    <label><input type="checkbox" id="failed"> failed page</label>
    <label><input type="checkbox" id="zones"> show click zones</label>
    <label><input type="checkbox" id="side"> simulate sidebar</label>
    <label><input type="checkbox" id="hdr" checked> header</label>
    <label><input type="checkbox" id="ftr" checked> toolbar</label>
    <button id="theme" style="margin-left:auto">theme</button>
  </div>

  <div class="main">
    <div id="sidebar" class="side" style="display:none">
      simulated sidebar — the reading area narrows but the window does not
    </div>

    <div class="col">
      <div id="hdrBar" class="banner">header banner</div>

      <div id="viewport" class="grow">
        <div id="row"></div>
        <button id="zoneLeft" aria-label="Previous page"></button>
        <button id="zoneRight" aria-label="Next page"></button>
      </div>

      <div id="ftrBar" class="footer">
        <span>toolbar</span><span id="clicks"></span><span id="state"></span>
      </div>
    </div>
  </div>
</div>
<pre id="result" hidden></pre>

   tests/unit/harness.spec.ts runs this against the real function over a grid
   of sizes, modes and rotations and requires identical results. */
/* BEGIN ROTATED_FIT */
function isSidewaysRotation(r){ return r % 180 !== 0 }
function rotatedFit(natural, container, fitMode, rotation) {
  if (!isSidewaysRotation(rotation)) return null
  if (!natural.width || !natural.height || !isFinite(natural.width) || !isFinite(natural.height)) return null
  const usableWidth = Math.max(container.width, 1), usableHeight = Math.max(container.height, 1)
  const displayedWidth = natural.height, displayedHeight = natural.width
  let scale
  switch (fitMode) {
    case 'fit-width':  scale = usableWidth / displayedWidth; break
    case 'fit-height': scale = usableHeight / displayedHeight; break
    case 'original':   scale = 1; break
    default: {
      const upright = Math.min(usableWidth / natural.width, usableHeight / natural.height)
      const rotated = Math.min(usableWidth / displayedWidth, usableHeight / displayedHeight)
      scale = Math.min(upright, rotated)
    }
  }
  if (!isFinite(scale) || scale <= 0) return null
  return { image:{width:natural.width*scale,height:natural.height*scale},
           footprint:{width:natural.height*scale,height:natural.width*scale} }
}
/* END ROTATED_FIT */

/* ---- the style tables of ReaderViewport.vue ----
   Everything from here to the zones is the component's own text, apart from
   the function wrappers: the per-mode table, the fixed part of each level's
   style, the placeholder, and the two styles a sideways page gets.
   tests/unit/harness.spec.ts compares each with the component. */
/* BEGIN FIT_LAYOUT */
const FIT_LAYOUT = {
  'fit-page': {
    viewport: { overflow: 'hidden' },
    row: { width: '100%', height: '100%' },
    pane: { flex: '1 1 0%', height: '100%' },
    image: { maxWidth: '100%', maxHeight: '100%' }
  },
  'fit-width': {
    viewport: { overflowY: 'auto', overflowX: 'hidden' },
    row: { width: '100%' },
    pane: { flex: '1 1 0%' },
    image: { width: '100%', height: 'auto', maxWidth: 'none' }
  },
  'fit-height': {
    viewport: { overflowX: 'auto', overflowY: 'hidden' },
    row: { height: '100%' },
    pane: { height: '100%' },
    image: { height: '100%', width: 'auto', maxWidth: 'none' }
  },
  original: {
    viewport: { overflow: 'auto' },
    row: {},
    pane: {},
    image: { maxWidth: 'none', maxHeight: 'none' }
  }
}
/* END FIT_LAYOUT */
/* BEGIN SIDEWAYS_SCROLL */
const SIDEWAYS_SCROLL = {
  'fit-width': { overflowY: 'scroll' },
  'fit-height': { overflowX: 'scroll' }
}
/* END SIDEWAYS_SCROLL */

const viewportStyle = (m) => ({
  position: 'relative',
  display: 'flex',
  width: '100%',
  height: '100%',
  minWidth: 0,
  minHeight: 0,
  userSelect: 'none',
  ...FIT_LAYOUT[m].viewport
})
const rowStyle = (m) => ({
  margin: 'auto',
  display: 'flex',
  alignItems: 'center',
  justifyContent: 'center',
  gap: '0.25rem',
  minWidth: '100%',
  minHeight: '100%',
  ...FIT_LAYOUT[m].row
})
const paneStyle = (m) => ({
  position: 'relative',
  display: 'flex',
  minWidth: 0,
  ...FIT_LAYOUT[m].pane
})
const uprightImageStyle = (m, rotation) => ({
  display: 'block',
  objectFit: 'contain',
  margin: 'auto',
  ...FIT_LAYOUT[m].image,
  ...(rotation === 180 ? { transform: 'rotate(180deg)' } : {})
})
const placeholderStyle = {
  margin: 'auto',
  display: 'flex',
  flexDirection: 'column',
  alignItems: 'center',
  justifyContent: 'center',
  gap: '0.5rem',
  padding: '2rem',
  textAlign: 'center'
}
function wrapperStyle(box) {
  return {
    position: 'relative',
    flex: '0 0 auto',
    margin: 'auto',
    width: `${box.footprint.width}px`,
    height: `${box.footprint.height}px`
  }
}
function rotatedImageStyle(box, rotation) {
  return {
    position: 'absolute',
    display: 'block',
    maxWidth: 'none',
    width: `${box.image.width}px`,
    height: `${box.image.height}px`,
    left: `${(box.footprint.width - box.image.width) / 2}px`,
    top: `${(box.footprint.height - box.image.height) / 2}px`,
    transform: `rotate(${rotation}deg)`,
    transformOrigin: 'center'
  }
}

/* The page-turn zones: zoneStyle, the two bindings on the buttons, and
   onScroll's clamp, as in the component. */
/* BEGIN ZONES */
const zoneStyle = (offset) => ({
  position: 'absolute',
  top: `${offset.top}px`,
  bottom: `calc(1rem - ${offset.top}px)`,
  width: '25%',
  opacity: 0
})
const leftZoneStyle = (offset) => ({ ...zoneStyle(offset), left: `${offset.left}px`, cursor: 'w-resize' })
const rightZoneStyle = (offset) => ({ ...zoneStyle(offset), right: `calc(1rem - ${offset.left}px)`, cursor: 'e-resize' })
function clampedScrollOffset(element, row) {
  return {
    top: Math.min(element.scrollTop, Math.max(0, row.scrollHeight - element.clientHeight)),
    left: Math.min(element.scrollLeft, Math.max(0, row.scrollWidth - element.clientWidth))
  }
}
/* END ZONES */

const MODES=['fit-page','fit-width','fit-height','original'], ROTS=[0,90,180,270];
const params = new URLSearchParams(location.search);
let mode = MODES.includes(params.get('mode')) ? params.get('mode') : 'fit-page';
let rot = ROTS.includes(+params.get('rot')) ? +params.get('rot') : 0;
for (const id of ['two','wide','failed','zones','side']) {
  if (params.get(id) === '1') document.getElementById(id).checked = true;
}
for (const id of ['hdr','ftr']) {
  if (params.get(id) === '0') document.getElementById(id).checked = false;
}

const vp = document.getElementById('viewport'), row = document.getElementById('row');
const zoneLeft = document.getElementById('zoneLeft'), zoneRight = document.getElementById('zoneRight');
const clicks = { left: 0, right: 0, retry: 0, chrome: 0 };
const showClicks = () => { document.getElementById('clicks').textContent =
  `clicks: prev ${clicks.left} · next ${clicks.right} · retry ${clicks.retry} · toolbar toggle ${clicks.chrome}` };
zoneLeft.onclick = e => { e.stopPropagation(); clicks.left++; showClicks() };
zoneRight.onclick = e => { e.stopPropagation(); clicks.right++; showClicks() };
vp.onclick = () => { clicks.chrome++; showClicks() };

function setStyle(el, style) { el.removeAttribute('style'); Object.assign(el.style, style) }

// One <img> per test page, made once and moved into place on each render.
// A fresh element would have no size until its (data URL) image had loaded
// again, a moment later; an element that has loaded keeps its size wherever
// it is put, so a layout can be measured in the same breath as it is made.
const IMG = {};
for (const key of Object.keys(SRC)) { IMG[key] = document.createElement('img'); IMG[key].src = SRC[key]; }

function placeZones() {
  const offset = clampedScrollOffset(vp, row);
  const tint = document.getElementById('zones').checked;
  setStyle(zoneLeft, leftZoneStyle(offset));
  setStyle(zoneRight, rightZoneStyle(offset));
  // Display aid only; the app's zones are invisible.
  if (tint) [zoneLeft, zoneRight].forEach(z => Object.assign(z.style, { opacity: '0.25', background: '#5b3fd9' }));
}
vp.addEventListener('scroll', placeZones, { passive: true });

function mkButtons(el, values, set) {
  values.forEach(v => { const b=document.createElement('button'); b.textContent=v; b.dataset.v=v;
    b.onclick=()=>{set(v); render()}; el.appendChild(b) })
}
mkButtons(document.getElementById('fits'), MODES, v=>mode=v);
mkButtons(document.getElementById('rots'), ROTS, v=>rot=+v);

function render() {
  setStyle(vp, { ...viewportStyle(mode), ...(isSidewaysRotation(rot) ? SIDEWAYS_SCROLL[mode] : {}), background:'var(--surface)' });
  setStyle(row, rowStyle(mode));

  document.getElementById('sidebar').style.display=document.getElementById('side').checked?'':'none';
  document.getElementById('hdrBar').style.display=document.getElementById('hdr').checked?'':'none';
  document.getElementById('ftrBar').style.display=document.getElementById('ftr').checked?'':'none';

  // twoPageActive = !isSideways && preference  (mirrors useReaderState)
  const pref=document.getElementById('two').checked;
  const twoPageActive = !isSidewaysRotation(rot) && pref;
  const useWide=document.getElementById('wide').checked;
  const failed=document.getElementById('failed').checked;
  const keys = useWide ? ['wide'] : (twoPageActive ? ['p1','p2'] : ['p1']);

  // The client box, as the component measures it: what a scrollbar leaves.
  const box={width:vp.clientWidth,height:vp.clientHeight};
  row.innerHTML='';
  keys.forEach(k=>{
    const pane=document.createElement('div');
    pane.className='pane'; setStyle(pane, paneStyle(mode));
    const fit=rotatedFit(NAT[k],{width:box.width,height:box.height},mode,rot);
    if (failed) {
      // The unreadable-page placeholder, with its retry button lifted above
      // the zones exactly as the component does it.
      const ph=document.createElement('div'); setStyle(ph, placeholderStyle);
      const p=document.createElement('p'); p.textContent='This page could not be read'; p.style.fontSize='.875rem'; p.style.margin='0';
      const b=document.createElement('button'); b.className='retry'; b.textContent='Try again';
      b.setAttribute('style', 'position: relative; z-index: 1');
      Object.assign(b.style, { border:'1px solid var(--outline)', borderRadius:'.25rem', padding:'.25rem .75rem' });
      b.onclick = e => { e.stopPropagation(); clicks.retry++; showClicks() };
      ph.append(p, b); pane.appendChild(ph);
    } else if (fit) {
      const wrap=document.createElement('div');
      setStyle(wrap, wrapperStyle(fit));
      const img=IMG[k];
      setStyle(img, rotatedImageStyle(fit, rot));
      wrap.appendChild(img); pane.appendChild(wrap);
    } else {
      const img=IMG[k];
      setStyle(img, uprightImageStyle(mode, rot));
      pane.appendChild(img);
    }
    row.appendChild(pane);
  });
  placeZones();

  [...document.getElementById('fits').children].forEach(b=>b.style.fontWeight=b.dataset.v===mode?'700':'400');
  [...document.getElementById('rots').children].forEach(b=>b.style.fontWeight=+b.dataset.v===rot?'700':'400');
  requestAnimationFrame(() => requestAnimationFrame(report));
}

const near = (a, b, tolerance = 2) => Math.abs(a - b) <= tolerance;
const REM = parseFloat(getComputedStyle(document.documentElement).fontSize);

/** Everything the page can check about itself, as plain data. */
function measure() {
  const box = vp.getBoundingClientRect();
  // The padding box: where absolutely positioned children are placed, and
  // what is left of the viewport once a scrollbar has taken its share.
  const inner = { left: box.left + vp.clientLeft, top: box.top + vp.clientTop,
    right: box.left + vp.clientLeft + vp.clientWidth, bottom: box.top + vp.clientTop + vp.clientHeight };
  const result = { mode, rot, container: `${Math.round(box.width)}x${Math.round(box.height)}`,
    scroll: `${vp.scrollLeft},${vp.scrollTop} of ${vp.scrollWidth - vp.clientWidth},${vp.scrollHeight - vp.clientHeight}` };

  const images = [...row.querySelectorAll('img')];
  if (images.length) {
    const first = images[0].getBoundingClientRect();
    result.visual = `${Math.round(first.width)}x${Math.round(first.height)}`;
    if (mode === 'fit-page') result.fits = first.width <= box.width + 1 && first.height <= box.height + 1;
    // The other three modes each promise a size too. Against the client
    // box: a page sized to the outer box loses a scrollbar's width.
    const rects = images.map(im => im.getBoundingClientRect());
    const sideways = isSidewaysRotation(rot);
    if (mode === 'fit-width') result.fillsWidth = near(rects.reduce((sum, r) => sum + r.width, 0) + (rects.length - 1) * REM / 4, vp.clientWidth);
    if (mode === 'fit-height') result.fillsHeight = rects.every(r => near(r.height, vp.clientHeight));
    if (mode === 'original') result.naturalSize = rects.every((r, i) => near(r.width, sideways ? images[i].naturalHeight : images[i].naturalWidth) && near(r.height, sideways ? images[i].naturalWidth : images[i].naturalHeight));
    // Against the page's own pane, so a two-page spread is judged per half.
    // Only meaningful where the page is not larger than its pane on that axis.
    result.centred = images.every(im => {
      const ir = im.getBoundingClientRect(), pr = im.closest('.pane').getBoundingClientRect();
      const horizontal = ir.width > pr.width + 1 || near(ir.left - pr.left, pr.right - ir.right);
      const vertical = ir.height > pr.height + 1 || near(ir.top - pr.top, pr.bottom - ir.bottom);
      return horizontal && vertical;
    });
  }

  // The zones must sit over the visible area wherever the page is scrolled...
  const zl = zoneLeft.getBoundingClientRect(), zr = zoneRight.getBoundingClientRect();
  result.zonesInView =
    near(zl.left, inner.left) && near(zl.top, inner.top) && near(zl.bottom, inner.bottom - REM) &&
    near(zr.right, inner.right - REM) && near(zr.top, inner.top) && near(zr.bottom, inner.bottom - REM) &&
    near(zl.width, vp.clientWidth / 4) && near(zr.width, vp.clientWidth / 4);
  // ...and must not make the scrollable area any larger than the page needs.
  result.zonesAddNoScroll =
    vp.scrollHeight <= Math.max(row.scrollHeight, vp.clientHeight) + 1 &&
    vp.scrollWidth <= Math.max(row.scrollWidth, vp.clientWidth) + 1;
  // A click at either edge has to land on a zone, not on the page behind it.
  const hit = (x, y) => document.elementFromPoint(x, y);
  const midY = inner.top + (vp.clientHeight - REM) / 2;
  result.edgeClicksTurnPages = hit(inner.left + 8, midY) === zoneLeft && hit(inner.right - REM - 8, midY) === zoneRight;
  // And a click in the middle has to reach the viewport (toolbar toggle).
  const middle = hit(inner.left + vp.clientWidth / 2, midY);
  result.middleIsNotAZone = middle !== zoneLeft && middle !== zoneRight;

  const retries = [...row.querySelectorAll('.retry')];
  if (retries.length) {
    // Every corner region of every retry button must be the button itself.
    result.retryClickable = retries.every(b => {
      const r = b.getBoundingClientRect();
      return [[r.left + 3, r.top + 3], [r.right - 3, r.top + 3], [r.left + 3, r.bottom - 3],
              [r.right - 3, r.bottom - 3], [(r.left + r.right) / 2, (r.top + r.bottom) / 2]]
        .every(([x, y]) => hit(x, y) === b);
    });
  }
  return result;
}

/** Set while a scripted run is going through every case; see the end. */
let batch = false;

function report() {
  if (batch) return;
  let result;
  try {
    result = measure();
  } catch (error) {
    // Say so where a scripted run will see it, rather than leaving it blank.
    document.getElementById('result').textContent = JSON.stringify({ error: String(error && error.stack || error) });
    document.getElementById('state').textContent = `harness error: ${error}`;
    return;
  }
  const mark = (ok, yes, no) => ok === undefined ? '' : `  ${ok ? '✓ ' + yes : '✗ ' + no}`;
  document.getElementById('state').textContent =
    `${result.mode} ${result.rot}°  container=${result.container}  visual=${result.visual ?? '-'}  scroll=${result.scroll}`
    + mark(result.fits, 'fits', 'OVERFLOWS') + mark(result.centred, 'centred', 'OFF-CENTRE')
    + mark(result.zonesInView, 'zones in view', 'ZONES OUT OF VIEW')
    + mark(result.zonesAddNoScroll, 'no extra scroll', 'ZONES ADD SCROLL')
    + mark(result.edgeClicksTurnPages, 'edges turn pages', 'EDGE CLICK MISSES ZONE')
    + mark(result.retryClickable, 'retry clickable', 'RETRY COVERED');
  document.getElementById('result').textContent = JSON.stringify(result);
}
vp.addEventListener('scroll', () => requestAnimationFrame(report), { passive: true });

['two','wide','failed','zones','side','hdr','ftr'].forEach(id=>document.getElementById(id).addEventListener('change',render));
document.getElementById('theme').onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'};
new ResizeObserver(render).observe(vp);
showClicks();
render();

// Once the images have their sizes, lay out again and measure straight away,
// without waiting for an animation frame: a headless browser dumping the page
// may never give it one. For a scripted run that asks for it, first scroll as
// far as the page goes, as a reader would have. The zones are placed by hand
// there rather than by the scroll event, for the same reason.
function measureAt(scroll) {
  render();
  vp.scrollTo(0, 0);
  if (scroll === 'end') vp.scrollTo(vp.scrollWidth, vp.scrollHeight);
  placeZones();
}

/** ?all=1: every fit mode, rotation, page layout, failed state and scroll
    position in one page load, with the results as a JSON array in #result.
    Synchronous throughout, so the array is complete when the handler returns. */
function runAll() {
  batch = true;
  const results = [];
  const unloaded = Object.keys(IMG).filter((key) => !IMG[key].complete || !IMG[key].naturalWidth);
  if (unloaded.length) {
    // Measuring pages that have no size would pass everything, vacuously.
    results.push({ ok: false, error: `test images not loaded: ${unloaded.join(', ')}` });
  } else {
    for (const m of MODES) for (const r of ROTS) for (const layout of ['single', 'two', 'wide'])
    for (const failed of [false, true]) for (const scroll of ['start', 'end']) {
      mode = m; rot = r;
      document.getElementById('two').checked = layout === 'two';
      document.getElementById('wide').checked = layout === 'wide';
      document.getElementById('failed').checked = failed;
      const label = { layout, failed, scrollTo: scroll };
      try {
        measureAt(scroll);
        const checks = measure();
        // `ok` is the verdict; the label's own `failed: false` is not one.
        results.push({ ok: !Object.values(checks).includes(false), ...label, ...checks });
      } catch (error) {
        results.push({ ok: false, mode: m, rot: r, ...label, error: String(error && error.stack || error) });
      }
    }
  }
  document.getElementById('result').textContent = JSON.stringify(results);
  document.getElementById('state').textContent =
    `${results.length} cases, ${results.filter((x) => !x.ok).length} failing`;
}

addEventListener('load', () => {
  if (params.get('all') === '1') {
    runAll();
    return;
  }
  measureAt(params.get('scroll'));
  report();
});
</script>
</body>
</html>
