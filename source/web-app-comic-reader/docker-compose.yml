# Minimal stack for developing the comic reader against a real OpenCloud.
# DEVELOPMENT ONLY: it runs with a known admin password and demo users, which
# is why the port below is published on loopback and nowhere else.
# `pnpm build:w` (or `npm run build:w`) rebuilds dist/ on save; the volume
# mount below puts it where the OpenCloud web runtime discovers apps.
services:
  opencloud:
    image: ${OC_IMAGE:-opencloudeu/opencloud-rolling:latest}
    entrypoint: /bin/sh
    command: ['-c', 'opencloud init || true && opencloud server']
    environment:
      OC_URL: https://localhost:9200
      OC_INSECURE: 'true'
      OC_LOG_LEVEL: error
      IDM_ADMIN_PASSWORD: admin
      IDM_CREATE_DEMO_USERS: 'true'
      PROXY_TLS: 'true'
      WEB_ASSET_APPS_PATH: /web/apps
      # Reading CBR and CB7 needs WebAssembly and a worker. The stock policy
      # does not allow either, so development mirrors the CSP note in README.
      PROXY_CSP_CONFIG_FILE_LOCATION: /etc/opencloud/csp.yaml
    ports:
      - '127.0.0.1:9200:9200'
    volumes:
      - opencloud-config:/etc/opencloud
      - ./dev/docker/opencloud/apps.yaml:/etc/opencloud/apps.yaml
      - ./dev/docker/opencloud/csp.yaml:/etc/opencloud/csp.yaml
      - ./dist:/web/apps/comic-reader

volumes:
  opencloud-config:
